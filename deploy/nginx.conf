# /etc/nginx/sites-available/trading-sim
# Reverse proxy: port 80 → Streamlit on port 8501
#
# Deploy:
#   sudo cp nginx.conf /etc/nginx/sites-available/trading-sim
#   sudo ln -s /etc/nginx/sites-available/trading-sim /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;   # Replace with your domain or EC2 public IP

    # Streamlit app
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket support (required by Streamlit)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long timeout to keep Streamlit connections alive
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Streamlit static assets
    location /static {
        proxy_pass http://127.0.0.1:8501/static;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8501/healthz;
    }

    location /vendor {
        proxy_pass http://127.0.0.1:8501/vendor;
    }

    # Stream endpoint (Streamlit uses SSE)
    location /stream {
        proxy_pass          http://127.0.0.1:8501/stream;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;
    }
}
